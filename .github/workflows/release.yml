name: Release Build (Windows desktop)

# Сборка desktop-приложения под Windows.
# Запускается:
#   • при пуше тега вида v1.2.3 — собирает приложение и публикует GitHub Release;
#   • вручную (workflow_dispatch) — собирает и кладёт zip в artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания Release и заливки ассетов

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # Упаковываем готовую сборку (папка Release) в zip.
      - name: Package build
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath "detective-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: detective-windows
          path: detective-windows.zip
          if-no-files-found: error
          retention-days: 14

      # Только при пуше тега: публикуем Release с прикреплённым zip.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: detective-windows.zip
          generate_release_notes: true
